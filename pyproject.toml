[project]
name = "vetsys-assistant"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Luan Gabriel", email = "luan.pessoalx@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "langchain>=1.5.2",
    "langchain-chroma>=1.1.0",
    "langchain-google-genai>=4.5.2",
    "langchain-text-splitters>=1.1.3",
    "python-dotenv>=1.2.4",
]

[project.scripts]
vetsys-assistant = "vetsys_assistant:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
